<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>


<body>
  <header>
    <nav class="navbar text-light bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand text-light  " href="#">
          <img src="images/logo.png" alt="Logo" width="55" height="55" class="rounded me-4">
          Expense Tracker
        </a>
      </div>
    </nav>
  </header>
  <main>
    <div class="container mt-3">
      <div id="alertMessage" class="alert d-none" role="alert"></div>
    </div>

    <div class="summary-cards mt-3">
      <div >
        <div class="card h-100">
          <div class="card-body">
            <p class="card-title text-center">total</p>
            <p id="totalAmount" class="card-text text-center">10</p>
          </div>
        </div>
      </div>
      <div >
        <div class="card h-100">
          <div class="card-body">
            <p class="card-title text-center">Number of expense</p>
            <p id="expenseCount" class="card-text text-center">3</p>
          </div>
        </div>
      </div>
      <div >
        <div class="card h-100">
          <div class="card-body">
            <p class="card-title text-center">Highest expense</p>
            <p id="highestExpense" class="card-text text-center">40</p>
          </div>
        </div>
      </div>
    </div>
    <section class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-4">Add New Expense</h2>

          <form id="expenseForm">
            <div class="row g-3">


              <div class="col-12 col-md-6 col-lg-3">
                <label for="expenseTitle" class="form-label">
                  Title
                </label>

                <input type="text" class="form-control" id="expenseTitle" name="title" placeholder="Enter expense title"
                  required>
              </div>


              <div class="col-12 col-md-6 col-lg-3">
                <label for="expenseAmount" class="form-label">Amount</label>
                <input type="number" class="form-control" id="expenseAmount" name="amount" placeholder="Enter amount"
                  min="0.1" step="0.01" required>
              </div>


              <div class="col-12 col-md-6 col-lg-3">
                <label for="expenseCategory" class="form-label">Category</label>
                <select class="form-select" id="expenseCategory" name="category" required>
                  <option value="" selected disabled>Choose category
                  </option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>


              <div class="col-12 col-md-6 col-lg-3">
                <label for="expenseDate" class="form-label">Date</label>
                <input type="date" class="form-control" id="expenseDate" name="date" required>
              </div>

            </div>


            <div class="text-start mt-4">
              <button type="submit" class="btn btn-primary">Add Expense</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editExpenseModalLabel">
              Edit Expense
            </h5>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <form id="editExpenseForm">
              <div class="mb-3">
                <label for="editExpenseTitle" class="form-label">
                  Title
                </label>

                <input type="text" class="form-control" id="editExpenseTitle" required />
              </div>

              <div class="mb-3">
                <label for="editExpenseAmount" class="form-label">
                  Amount
                </label>

                <input type="number" class="form-control" id="editExpenseAmount" min="0.1" step="0.01" required />
              </div>

              <div class="mb-3">
                <label for="editExpenseCategory" class="form-label">
                  Category
                </label>

                <select class="form-select" id="editExpenseCategory" required>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="editExpenseDate" class="form-label">
                  Date
                </label>

                <input type="date" class="form-control" id="editExpenseDate" required />
              </div>

              <button type="submit" class="btn btn-primary"> Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <section class="container mt-5 mb-5">
      <div class="card shadow-sm">

        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="card-title mb-0">Expenses List</h2>

            <div>
              <label for="categoryFilter" class="form-label mb-3">Category</label>

              <select id="categoryFilter" class="form-select">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div id="loadingSpinner" class="text-center my-3 d-none">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading expenses...</p>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="thtable">
                <tr>
                  <th>Title</th>
                  <th>Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="expensesTableBody">

              </tbody>
            </table>
          </div>
        </div>

      </div>
    </section>


  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
